<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- KwartoKeeper Brand Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <title>KwartoKeeper</title>
    <style>
      /* The waiting screen before the app loads (same as components/BrandLoader.jsx) */
      #kk-boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #fff; font-family: "Open Sans", system-ui, sans-serif; }
      #kk-boot img { width: 64px; height: auto; animation: kkb-b 1.6s ease-in-out infinite; }
      #kk-boot .rooms { display: grid; grid-template-columns: repeat(5, 10px); gap: 6px; }
      #kk-boot .rooms i { width: 10px; height: 10px; border-radius: 3px; background: rgba(32,32,32,.1); animation: kkb-r 1.25s ease-in-out infinite; }
      #kk-boot .rooms i:nth-child(2) { animation-delay: .12s } #kk-boot .rooms i:nth-child(3) { animation-delay: .24s }
      #kk-boot .rooms i:nth-child(4) { animation-delay: .36s } #kk-boot .rooms i:nth-child(5) { animation-delay: .48s }
      #kk-boot span { font-size: 12px; font-weight: 600; color: #545454; }
      @keyframes kkb-r { 0%, 70%, 100% { background: rgba(32,32,32,.1); transform: scale(.86) } 35% { background: #ff4500; transform: scale(1) } }
      @keyframes kkb-b { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
      @media (prefers-reduced-motion: reduce) { #kk-boot * { animation: none !important } }
    </style>
  </head>
  <body>
    <div id="root"><div id="kk-boot" role="status" aria-label="Loading"><img src="/KwartoKeeper-Icon.png" alt="KwartoKeeper" /><div class="rooms" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><span>Loading…</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
